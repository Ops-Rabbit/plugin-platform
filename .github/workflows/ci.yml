name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - name: Pack release candidates
        run: |
          mkdir -p release-candidates
          pnpm --dir packages/plugin-sdk pack --pack-destination "$GITHUB_WORKSPACE/release-candidates"
          pnpm --dir packages/create-plugin pack --pack-destination "$GITHUB_WORKSPACE/release-candidates"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-candidates
          path: release-candidates/*.tgz
          if-no-files-found: error
          retention-days: 7
